      }catch(e){}
    }
  });
}

  <div class=&quot;slide&quot;><img src=&quot;images/img_4.jpg&quot;><div class=&quot;credit&quot; style=&quot;font-size:8px&quot;>⁠© Sony Interactive Entertainment Inc.⁠</div><div class=&quot;text&quot; style=&quot;font-size:12px;&quot;><p>初期の段階では柔らかさを表現したいため、表面的に素材感のあるビジュアルで検討していました。ある時、「いっそのこと、スーパーフラットな表現にすれば、NURBS で描かれたロコロコの輪郭の変化を素直に見せることができるし、一番柔らかさを表現できるかも！」と閃き、方針を決定しました。その後は、微調整を重ね、最終的なビジュアルになっていきました。</p></div></div>

  <div class=&quot;slide&quot;><img src=&quot;images/img_7.jpg&quot;><div class=&quot;credit&quot; style=&quot;font-size:8px&quot;>⁠© Sony Interactive Entertainment Inc.⁠</div><div class=&quot;text&quot; style=&quot;font-size:12px;&quot;><p>最終的なビジュアルイメージ</p></div></div>

は６本ほどでしたが、その他、リワードとして用意したムービーが数十本と、特別なムービーとしてクレイアニメ調のムービー
１本がありました。私の業務としては、主に絵コンテの作成と、成果物に対してのフィードバックでした。</p></div></div>

しないため、ディレクターと「作っちゃう？」という話になり、デザインすることになりました。Illustrator でデザインした後、 TTFdit で TrueType フォントとして作成しました。</p></div></div>

オリジナルサウンドトラックのCD一式のデザイン</p></div></div>
  <div class=&quot;slide&quot;><img src=&quot;images/img_12.jpg&quot;><div class=&quot;credit&quot; style=&quot;font-size:8px&quot;>⁠© Sony Interactive Entertainment Inc.⁠</div><div class=&quot;text&quot; style=&quot;font-size:12px;&quot;><p>新年の挨拶と共に、JAPAN Studio で配布されたイラスト</p></div></div>
