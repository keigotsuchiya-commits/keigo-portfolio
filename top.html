  <div class=&quot;lead size-sm&quot;>対話から企画の魅力を深め、同じ未来を描くためのビジュアルへ。</div>

<p>言葉にするのが難しいアイデアや事業のコンセプトも、対話を重ねながら、一緒に丁寧にかたちを探していきます。対話のなかでお互いの視点をすり合わせ、企画意図が持つ本当の魅力をピントを合わせていく。そうして見えてきた一番大切な想いを、誰もが同じイメージを持てる「デザインのルール」へと落とし込んでいきます。</p><p>グラフィックデザインやアートディレクションの現場で、ずっと大切にしていることがあります。それは、ただ見た目をきれいに整えたり、言葉だけでその場をまとめたりすることではありません。</p><p>対話を通じて企画の本質をしっかり捉え、誰もが直感的に「これだ」と思えるビジュアルと、その理由を示すこと。それによって、立場や役割が違うさまざまな関係者が同じ方向を向き、迷わず進んでいける状態をつくることです。</p>
