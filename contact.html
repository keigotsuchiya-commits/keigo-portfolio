function __cardIframeOnload(iframe){
  try{
    var doc = iframe.contentDocument || iframe.contentWindow.document;
    var BASE_WIDTH = 480, MAX_SCALE = 1.36;
    var landscape = window.matchMedia && window.matchMedia("(orientation: landscape)").matches;
    var w = window.innerWidth || document.documentElement.clientWidth || 375;
    var scale = landscape ? Math.min(MAX_SCALE, Math.max(1, w / BASE_WIDTH)) : 1;
    var nodes = doc.body ? doc.body.querySelectorAll("*") : [];
    var i, el, n;
    for(i=0;i<nodes.length;i++){
      el = nodes[i];
      if(/^(IMG|VIDEO|IFRAME|SVG|SCRIPT|STYLE)$/.test(el.tagName)) continue;
      if(el.dataset.originalFontSize) continue;
      var hasDirectText = false;
      for(n=0;n<el.childNodes.length;n++){
        if(el.childNodes[n].nodeType === 3 && el.childNodes[n].textContent.trim()){ hasDirectText = true; break; }
      }
      if(!hasDirectText) continue;
      el.dataset.originalFontSize = getComputedStyle(el).fontSize;
    }
    for(i=0;i<nodes.length;i++){
      el = nodes[i];
      if(!el.dataset.originalFontSize) continue;
      var base = parseFloat(el.dataset.originalFontSize);
      if(isFinite(base)) el.style.fontSize = (base * scale) + "px";
    }
    var prevH = iframe.style.height;
    iframe.style.height = "0px";
    var h = (doc.documentElement && doc.documentElement.scrollHeight) || (doc.body && doc.body.scrollHeight) || 0;

      iframe._landscapeBound = true;
      window.addEventListener("resize", function(){ __cardIframeOnload(iframe); });
      window.addEventListener("orientationchange", function(){ __cardIframeOnload(iframe); });
    }
  }catch(e){ if(window.console) console.error("card-html iframe error:", e); }
}
