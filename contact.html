var __cardFrames = [];

function __cardApplyScale(doc, scale){
  if(!doc || !doc.body) return;

  doc.__cardAppliedScale = scale;
  var nodes = doc.body.querySelectorAll("*");
  var i, el, n;

    el = nodes[i];

    if(el.dataset.originalFontSize) continue;
    var hasDirectText = false;
    for(n=0;n<el.childNodes.length;n++){
      if(el.childNodes[n].nodeType === 3 && el.childNodes[n].textContent.trim()){ hasDirectText = true; break; }
    }
    if(!hasDirectText) continue;
    el.dataset.originalFontSize = getComputedStyle(el).fontSize;
  }
  for(i=0;i<nodes.length;i++){
    el = nodes[i];
    if(!el.dataset.originalFontSize) continue;
    var base = parseFloat(el.dataset.originalFontSize);

}
function __cardSyncHeight(iframe){

  var h = (doc.documentElement && doc.documentElement.scrollHeight) || (doc.body && doc.body.scrollHeight) || 0;

}
function __cardOnViewportChange(){
  var w = window.innerWidth || document.documentElement.clientWidth || 0;

        __cardSyncHeight(__cardFrames[i]);
      }catch(e){}
    }
  });
}

    dotWrap.setAttribute('data-pos', ind.pos || 'bottom-center');

      var b = document.createElement('button');
      b.type = 'button'; b.className = 'ss-dot';
      b.setAttribute('aria-label', (i + 1) + '枚目を表示');
      b.addEventListener('click', function () { go(i); });
      dotWrap.appendChild(b); dots.push(b);
    });
    root.appendChild(dotWrap); paint();
  }
  function paint() {
    var ind = cfg.indicator || {};

      var on = i === cur;
      b.style.background = on ? (ind.active || '#ffffff') : (ind.inactive || '#ffffff');
      b.style.opacity = on ? '1' : '0.45';
      b.setAttribute('aria-current', on ? 'true' : 'false');

    stripe: function (prev, next, D, W, H) {

            ctx.drawImage(chans[0].c, 0, 0, 1, ch, 0, 0, off, ch);
            ctx.drawImage(chans[2].c, cw - 1, 0, 1, ch, cw - off, 0, off, ch);
            ctx.globalCompositeOperation = 'source-over';
          } else {
            ctx.drawImage(frame, 0, 0);
          }

    if (!auto || busy || imgs.length < 2) return;
    timer = setTimeout(function () { go((cur + 1) % imgs.length); }, Math.max(0.5, cfg.display) * 1000);

  function go(i) {

      .catch(function () {})
      .then(function () { base.src = next.src; return base.decode ? base.decode().catch(function () {}) : 0; })
      .then(function () { fx.innerHTML = ''; busy = false; schedule(); });
  }

    add: addImages,
    next: function () { go((cur + 1) % imgs.length); },
